services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: minishop
      POSTGRES_USER: minishop
      POSTGRES_PASSWORD: local-only-not-for-deployment
    volumes:
      - shop-db:/var/lib/postgresql
      - ./scripts/init-search.sql:/docker-entrypoint-initdb.d/01-search.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minishop -d minishop"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
  shop:
    build: .
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      LAB_MODE: ${LAB_MODE:-disabled}
      Jwt__LabSecret: ${Jwt__LabSecret:-}
      ConnectionStrings__Shop: Host=database;Port=5432;Database=minishop;Username=minishop;Password=local-only-not-for-deployment
      ConnectionStrings__Search: Host=database;Port=5432;Database=minishop;Username=minishop_search;Password=local-search-only
    depends_on:
      database:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  shop-db:
